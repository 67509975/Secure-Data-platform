cat > .gitlab-ci.yml <<'EOF'
image: python:3.12-slim

stages:
  - test
  - security

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements-dev.txt

test:
  stage: test
  script:
    - python -m pytest -q

bandit:
  stage: security
  script:
    - bandit -r app

pip-audit:
  stage: security
  script:
    - pip-audit
EOF